name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: '0.16.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # mlugg/setup-zig@v2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check formatting
        run: zig fmt --check build.zig packages/

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      # mlugg/setup-zig@v2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ env.ZIG_VERSION }}

      # ripgrep is a search backend for the expert workspace tools, and the
      # recorded codegen corpus holds the bytes rg produces. A runner without it
      # takes the in-process fallback, whose bytes differ, and four cassettes
      # then replay as stale.
      - name: Install z3 and ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install z3 ripgrep
          else
            sudo apt-get update
            sudo apt-get install -y z3 ripgrep
          fi

      - name: Run authoritative verifier
        run: bash scripts/verify.sh
